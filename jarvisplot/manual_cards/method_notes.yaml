# Optional prose for live method man pages (jplot man <method>).
# Contracts always come from cap methods; this file only adds human tips.
# Keys must match METHOD_DISPATCH names exactly.

scatter:
  summary: "2D point cloud; optional colour (c) and size (s)."
  notes:
    - "Most common overlay / raw-sample method."
    - "optional c drives colorbar when style/frame provides a cmap path."
  traps:
    - "Huge N without downsample → heavy PDF/PNG; filter or subsample first."

plot:
  summary: "Polyline / curve through (x, y)."
  notes:
    - "Use for 1D theory curves and sorted scan tracks."
  traps:
    - "Unsorted x yields scribble lines — sort_by transform if needed."

pcolormesh:
  summary: "Rectilinear mesh colour field; needs x, y, z grids or flat mesh columns."
  notes:
    - "Default density/profile colour layer after transforms."
  traps:
    - "z missing or wrong shape → empty / crashed mesh; check dryrun after expand."

contour:
  summary: "Contour lines on a field; requires x, y, z."
  notes:
    - "Often used for HPD / iso-likelihood after density transforms."
  traps:
    - "Needs a gridded or interpolable z field, not raw scatter-only samples."

contourf:
  summary: "Filled contours; requires x, y, z."
  traps:
    - "Same field requirements as contour."

fill:
  summary: "Filled polygon / band from (x, y)."
  notes:
    - "Common for exclusion regions and theory bands."

fill_between:
  summary: "Vertical band between two y curves vs x."
  notes:
    - "coordinates may need y1/y2 depending on style; check contract optional keys."

voronoi:
  summary: "Voronoi cell field (often density visualisation)."
  notes:
    - "Heavy for large N; prefer type: posterior_2d density path when possible."

voronoif:
  summary: "Filled Voronoi field."
  notes:
    - "Sibling of voronoi with filled faces."

corrplot:
  summary: "Correlation matrix in R's corrplot style; draws the `correlation` transform's long table."
  notes:
    - "Reserved: only the [corrplot, matrix] or [corrplot, diamond] style card provides its axes (axcorr / axccorr)."
    - "No coordinates needed — x_index / y_index / rho are the transform's own output columns."
    - "style takes R's formals: method (circle|square|ellipse|color|shade|pie|number), type, diag, glyph.scale, outline, addgrid.col, plus the card's own ellipse.scale."
    - "Use [corrplot, matrix] for the square matrix; [corrplot, diamond] keeps one triangle, rotates it 45 degrees, and adds side: left|right (default right, which puts the triangle on the left of the page) plus stripe: alternate|none."
    - "order (original|AOE|FPC|hclust|alphabet) and addrect are resolved before the figure is built, then written into the transform's `columns`."
    - "sig.level switches on the significance test; unlike R no p.mat is needed, because the table carries n per pair."
    - "The glyph is sized from the solved cell and the coefficient text is back-solved from it, so both survive the 170 mm width clamp."
  traps:
    - "addrect needs order: hclust — the boxes are cuts of that tree, so there is nothing to cut under any other order."
    - "R's tl.pos: d is not supported: the diagonal carries cells here, not names."
    - "type is the printed wedge (row 0 at top); the `correlation` transform's own `triangle` names the halves in array terms. Leave the transform at full and let corrplot mask."
    - "The diamond card refuses type: full; it is already one triangle by construction."

jpfield:
  summary: "Jarvis field helper over a regular/irregular field."
  notes:
    - "Prefer when working with pre-gridded z fields."

jpcontour:
  summary: "Jarvis contour helper."
  notes:
    - "Prefer for density isocontours with JP conventions."

jpcontourf:
  summary: "Jarvis filled contour helper."

hist:
  summary: "Histogram; coordinate contract is method-specific (often x or values)."
  traps:
    - "Not a substitute for 2D density — use posterior_2d / profile for maps."

hist2d:
  summary: "2D histogram of raw rows; bins x/y itself and colours the counts."
  notes:
    - "Bins at render time, so no precomputed z table is needed — unlike pcolormesh."
    - "optional weights takes an expr, so per-row normalisation goes there."
    - "The colorbar range is read off the binned counts, not off a z column."
    - "style forwards bins / range / density / cmin / cmax straight to matplotlib."
  traps:
    - "range is nested for 2D: [[xmin, xmax], [ymin, ymax]], not a flat pair."
    - "density=True normalises globally; per-column or per-row normalisation has to come from weights."
    - "Signed weights can make a bin sum to <= 0; cmin blanks those out."

errorbar:
  summary: "Points with error bars."
  notes:
    - "Check optional keys for xerr/yerr in the live contract."

imshow:
  summary: "Matrix / image display; the only coordinate is z."
  notes:
    - "A z column is folded back into its matrix using the __grid_* metadata the producing transform published — correlation, or profile: {method: grid}."
    - "Cells the table never emitted stay transparent, so a correlation triangle draws as a triangle."
    - "Cards set interpolation: bilinear; a matrix wants interpolation: nearest on the layer."
  traps:
    - "No x/y coordinates: an image places cells by index, not by column. Use pcolormesh when the positions must come from data."
    - "A z with no grid metadata behind it has no shape, and the layer says so rather than guessing one."

dynesty_runplot:
  summary: "Dynesty nested-sampling run diagnostics panel."
  notes:
    - "Specialised; needs dynesty-compatible inputs, not generic CSV columns."

bar:
  summary: "Vertical bars (x, height)."
barh:
  summary: "Horizontal bars (y, width)."
step:
  summary: "Step plot through (x, y)."
quiver:
  summary: "Vector field arrows."
tricontour:
  summary: "Triangulation contour."
tricontourf:
  summary: "Filled triangulation contour."
tripcolor:
  summary: "Triangulation pseudocolor."
tripcolor_axes:
  summary: "Triangulation pseudocolor (axes helper variant)."
triplot:
  summary: "Draw triangulation edges."
pcolor:
  summary: "Pseudocolor quad mesh (sibling of pcolormesh)."
fill_betweenx:
  summary: "Horizontal band between two x curves vs y."
