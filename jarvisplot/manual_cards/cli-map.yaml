id: cli-map
title: CLI verb map
summary: All jplot agent verbs; live list also from jplot cap cli.
role: catalog
priority: 15
see_also: [agent-readme, workflow, doctor, data-columns, fonts, cache]
related_cli:
  - argv: [jplot, cap, cli, "--json"]
    why: live command catalogue (do not hardcode forever)
  - argv: [jplot, man, "--json"]
    why: manual index
  - argv: [jplot, man, agent-readme, "--json"]
    why: AI workflow and missing-feature reporting
  - argv: [jplot, "-h"]
    why: human root help (Rich panels)
live_sources:
  - verb: cap.cli
    truth: cards/args.json commands
human:
  panels:
    - kind: overview
      title: Roles
      body: |
        Sensor: data, cap, man, explain, fonts, template, suggest
        Judge: dryrun, doctor
        Editor tools: config get|set|rm|expand (optional)
        Render: jplot <file>  (bare path; no jplot run)
        Maintenance: cache list|scan|clean
    - kind: steps
      title: Core verbs
      items:
        - "jplot data describe|head|eval|suggest-axes"
        - "jplot cap [section]"
        - "jplot fonts show|list|resolve|check|set|reset"
        - "jplot man [topic]"
        - "jplot man agent-readme --json  # official package workflow and feature gaps"
        - "jplot dryrun|doctor"
        - "jplot config expand  # type → layers"
        - "jplot <file>         # render"
        - "jplot cache list|scan|clean"
    - kind: notes
      title: Human help style
      items:
        - "Default help is Rich fixed-column panels (Jarvis-HEP V2 family)."
        - "Agent machine I/O is always --json envelopes on stdout."
agent:
  body_markdown: |
    Prefer `jplot cap cli --json` for an up-to-date list.
    DR-08: there is no `jplot run`.
    Read `jplot fonts show --json` and `jplot fonts check --json` before rendering.
    Use `jplot man fonts --json` for role defaults, font discovery and persistent card edits.
