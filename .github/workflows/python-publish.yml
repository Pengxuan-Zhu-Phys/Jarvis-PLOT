# The local jprel script publishes to PyPI; this workflow verifies the GitHub release.
name: Verify Jarvis-PLOT release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release distributions
        run: |
          python -m pip install build twine
          python tools/check_release.py --tag "$GITHUB_REF_NAME"
          python -m build
          python -m twine check dist/*
          python tools/check_release.py --wheel dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
