[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "JarvisPLOT"
version = "2.1.11"
description = "Jarvis-PLOT: YAML-driven plotting engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "loguru",
  "pyyaml",
  "ruamel.yaml>=0.18",
  "jsonschema",

  "Jarvis-Operas>=1.1.4",
  "numpy",
  "pandas",
  "polars",
  "matplotlib",
  "h5py",
  "sympy",
  "scipy",
  "shapely",
  "deepmerge",
  "rich"
]

[project.scripts]
jplot = "jarvisplot.client:main"

[tool.setuptools.package-data]
jarvisplot = [
  "cards/**/*",
  "Figure/cards/**/*",
  "schema/**/*.json",
  "manual_cards/**/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvisplot*"]

# Keep local credentials and generated files out of wheel package data.
[tool.setuptools.exclude-package-data]
"*" = [
    "**/.DS_Store",
    "**/*.py[cod]",
    "**/.env",
    "**/.env.*",
    "**/.envrc",
    "**/.pypirc",
    "**/.pypirc.*",
    "**/.twinerc",
    "**/.pypi-token*",
    "**/.mcp.json",
    "**/release.env",
    "**/twine.env",
    "**/*.code-workspace",
    "**/*.swp",
    "**/*.swo",
    "**/*~",
    "**/*.bak",
    "**/*.tmp",
]
