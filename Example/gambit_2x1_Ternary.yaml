# Design-reference debug example  --  style [gambit_2x1, Ternary]
#
#   Run:    jplot gambit_2x1_Ternary.yaml
#   Shows:  the axes layout of this style card -- every axis box with its
#           rect [left, bottom, width, height] and width/height in cm, the
#           figure size, margins and colorbar gap -- drawn by `debug: true`.
#
# The figure has no data layers on purpose: this is a pure layout reference.

version: "0.3"

project:
  name: design_gambit_2x1_Ternary

Functions: []
DataSet: []

Figures:
  - name: gambit_2x1_Ternary
    debug: true                      # draw the design-reference dimension overlay
    style: [gambit_2x1, Ternary]
    frame:
      axtri: {labels: {left: "A", bottom: "B", right: "C"}}
    layers: []                       # empty -- layout reference only

output:
  dir: ./plots
  dpi: 150
  formats: [png]
