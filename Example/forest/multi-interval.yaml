# All statistics and coordinates are illustrative, supplied data.
DataSet:
- {name: rows, path: ./data/summary-rows.csv, type: csv}
- {name: points, path: ./data/summary-points.csv, type: csv}
- {name: intervals, path: ./data/summary-intervals.csv, type: csv}
Figures:
- name: forest-multi-interval
  type: forest
  data: rows
  points: points
  intervals: intervals
  glyph: box
  glyph_label: Box
  title: {text: Supplied distributions and intervals, fontsize: 7}
  header_note: {text: 'MC entries: S=100; B=200', fontsize: 4.3}
  columns:
  - {field: label, label: Input set, role: row_name, math: true}
  - {field: N, label: N inputs, role: left}
  x:
    label: Supplied coordinate
    lim: [0.60, 0.66]
    ticks: [0.60, 0.61, 0.62, 0.63, 0.64, 0.65, 0.66]
  description:
    text: |
      Supplied summaries.
      SD is not a CI.

      Example cut:
      $p_T > 25\,\mathrm{GeV}$
    fontsize: 4.3
    math: true
    math_fontfamily: stix
  frame:
    ax:
      legend:
        prop: {math_fontfamily: stix}
  forest:
    legend_math: true
    typography: {family: DejaVu Sans}
    geometry:
      footer_mm: 32
      point_band_mm: 10
      row_band_mm: 13
      row_pitch_mm: 13.3
      # A 10 mm plot band, split into two equal 5 mm halves.
      plot_y_mm: 7.5
      cell_y_mm: 1.35
      glyph_offset_mm: -2.5
      value_column_mm: 0
      legend_start_columns: [2, 6]
      description_start_column: 9
      description_columns: 4
    axis: {tick_suffix: ''}
    grid: {show: true, divisions: 4, alpha: 0.12}
    box:
      height_mm: 1.3
      annotation: {field: stats, fontsize: 4.3, color: '#0072B2', position: row_text}
    scatter:
      classes:
        cohort_a: {label: Observed fits, color: '#0072B2', diameter_mm: 0.65, marker: o, fill: true}
    overlays:
      legend: {label: '$\mathrm{mean}\pm\mathrm{SD}$', color: '#000000'}
      annotation: {field: stats, fontsize: 4.3, gap_mm: 0.5}
      classes:
        cohort_a: {label: A, color: '#0072B2', offset_mm: 0.85}
        cohort_b: {label: B, color: '#D55E00', alpha: 0.6, linestyle: '--', offset_mm: 2.5}
        repeat: {label: Repeat, color: '#009E73', marker: x, offset_mm: 4.15}
output: {dir: /tmp/jarvisplot-forest-examples, formats: [png, pdf], dpi: 220}
