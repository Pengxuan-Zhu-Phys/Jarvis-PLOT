# Design-reference debug examples for all gambit_2x1 style cards.
#
#   Run:    jplot Example/gambit_2x1.yaml
#
# Each figure is a pure layout reference with debug overlay enabled.

version: '0.3'
project:
  name: gambit_2x1
Functions: []
DataSet: []
Figures:
  - name: gambit_2x1_Ternary
    debug: true                      # draw the design-reference dimension overlay
    style: [gambit_2x1, Ternary]
    frame:
      axtri: {labels: {left: "A", bottom: "B", right: "C"}}
    layers: []                       # empty -- layout reference only

  - name: gambit_2x1_TernaryCmap
    debug: true                      # draw the design-reference dimension overlay
    style: [gambit_2x1, TernaryCmap]
    frame:
      axtri: {labels: {left: "A", bottom: "B", right: "C"}}
      axc: {label: {ylabel: "$z$"}}
    layers: []                       # empty -- layout reference only

  - name: gambit_2x1_rectcmap
    debug: true                      # draw the design-reference dimension overlay
    style: [gambit_2x1, rectcmap]
    frame:
      ax: {labels: {x: "$x$", y: "$y$"}}
      axc: {label: {ylabel: "$z$"}}
    layers: []                       # empty -- layout reference only

output:
  dir: ./plots
  dpi: 150
  formats:
    - png
    - pdf
